---
- name: Push rotated DB credential to webapp hosts
  hosts: webapp
  become: true
  gather_facts: false

  tasks:
    - name: Ensure app config directory exists
      ansible.builtin.file:
        path: /tmp/infragraph-demo-webapp
        state: directory
        mode: "0700"

    - name: Write new credential to app config
      ansible.builtin.copy:
        dest: /tmp/infragraph-demo-webapp/db-credential.env
        content: |
          DB_USERNAME=webapp
          DB_PASSWORD={{ new_password }}
        mode: "0600"

    - name: Render rotation status onto the live webapp page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>infragraph-demo webapp</title>
          <style>
            :root { color-scheme: dark; }
            * { box-sizing: border-box; }
            body {
              margin: 0;
              min-height: 100vh;
              display: flex;
              align-items: center;
              justify-content: center;
              background: radial-gradient(circle at 20% 20%, #1a1033 0%, #0a0e1a 55%, #05070d 100%);
              font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
              color: #e7e9ee;
            }
            .card {
              width: min(720px, 92vw);
              background: rgba(16, 20, 34, 0.85);
              border: 1px solid rgba(124, 92, 255, 0.35);
              border-radius: 18px;
              padding: 40px 44px;
              box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 60px rgba(124, 92, 255, 0.08) inset;
            }
            .badge {
              display: inline-flex;
              align-items: center;
              gap: 10px;
              font-size: 13px;
              letter-spacing: 0.08em;
              text-transform: uppercase;
              color: #7CFFB2;
              margin-bottom: 18px;
            }
            .dot {
              width: 10px; height: 10px; border-radius: 50%;
              background: #33FF8C;
              box-shadow: 0 0 0 0 rgba(51,255,140, 0.7);
              animation: pulse 1.8s infinite;
            }
            @keyframes pulse {
              0%   { box-shadow: 0 0 0 0 rgba(51,255,140, 0.55); }
              70%  { box-shadow: 0 0 0 12px rgba(51,255,140, 0); }
              100% { box-shadow: 0 0 0 0 rgba(51,255,140, 0); }
            }
            h1 {
              margin: 0 0 6px;
              font-size: 28px;
              letter-spacing: -0.01em;
              color: #ffffff;
            }
            .sub {
              margin: 0 0 32px;
              color: #9aa3b8;
              font-size: 14px;
            }
            .row {
              display: flex;
              justify-content: space-between;
              align-items: baseline;
              padding: 14px 0;
              border-top: 1px solid rgba(255,255,255,0.08);
            }
            .row:first-of-type { border-top: none; }
            .label {
              color: #9aa3b8;
              font-size: 13px;
              text-transform: uppercase;
              letter-spacing: 0.06em;
            }
            .value {
              font-size: 16px;
              color: #E9D8FF;
              font-weight: 600;
            }
            .value.mono { color: #7CFFB2; }
            .pipeline {
              margin-top: 32px;
              padding-top: 24px;
              border-top: 1px dashed rgba(255,255,255,0.12);
              display: flex;
              flex-wrap: wrap;
              gap: 8px;
              font-size: 12px;
              color: #6b7390;
            }
            .pipeline span {
              padding: 5px 10px;
              border-radius: 999px;
              background: rgba(124, 92, 255, 0.12);
              border: 1px solid rgba(124, 92, 255, 0.3);
              color: #c9bbff;
            }
            .arrow { color: #495066; align-self: center; }
          </style>
          </head>
          <body>
            <div class="card">
              <div class="badge"><span class="dot"></span> Day 2 Ops - Live</div>
              <h1>infragraph-demo webapp</h1>
              <p class="sub">Golden AMI deployed via HCP Terraform Stacks - eu-west-1</p>

              <div class="row">
                <span class="label">Credential status</span>
                <span class="value mono">● ROTATED</span>
              </div>
              <div class="row">
                <span class="label">Last rotated</span>
                <span class="value">{{ rotated_at }}</span>
              </div>
              <div class="row">
                <span class="label">Credential fingerprint</span>
                <span class="value mono">...{{ new_password[-6:] }}</span>
              </div>
              <div class="row">
                <span class="label">Service</span>
                <span class="value">httpd restarted, serving new credential context</span>
              </div>

              <div class="pipeline">
                <span>HCP Packer</span><span class="arrow">&rarr;</span>
                <span>HCP Terraform Stacks</span><span class="arrow">&rarr;</span>
                <span>HCP Vault Dedicated</span><span class="arrow">&rarr;</span>
                <span>Ansible</span>
              </div>
            </div>
          </body>
          </html>
        mode: "0644"

    - name: Restart app to pick up new credential
      ansible.builtin.systemd:
        name: httpd
        state: restarted
