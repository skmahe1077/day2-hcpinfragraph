---
- name: Push rotated DB credential to webapp hosts
  hosts: webapp
  gather_facts: false

  tasks:
    - name: Ensure app config directory exists
      ansible.builtin.file:
        path: /tmp/infragraph-demo-webapp
        state: directory
        mode: "0700"

    - name: Write new credential to app config
      ansible.builtin.copy:
        dest: /tmp/infragraph-demo-webapp/db-credential.env
        content: |
          DB_USERNAME=webapp
          DB_PASSWORD={{ new_password }}
        mode: "0600"

    - name: "Restart app (simulated)"
      ansible.builtin.debug:
        msg: "Would restart webapp service here to pick up new credential: {{ new_password }}"
