---
- name: Push rotated DB credential to webapp hosts
  hosts: webapp
  become: true
  gather_facts: false

  tasks:
    - name: Ensure app config directory exists
      ansible.builtin.file:
        path: /tmp/infragraph-demo-webapp
        state: directory
        mode: "0700"

    - name: Write new credential to app config
      ansible.builtin.copy:
        dest: /tmp/infragraph-demo-webapp/db-credential.env
        content: |
          DB_USERNAME=webapp
          DB_PASSWORD={{ new_password }}
        mode: "0600"

    - name: Render rotation status onto the live webapp page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <h1>infragraph-demo webapp - built by HCP Packer</h1>
          <p>DB credential last rotated: {{ rotated_at }}</p>
          <p>Credential fingerprint: ...{{ new_password[-6:] }}</p>
          <p>Status: httpd restarted, new credential active.</p>
        mode: "0644"

    - name: Restart app to pick up new credential
      ansible.builtin.systemd:
        name: httpd
        state: restarted
